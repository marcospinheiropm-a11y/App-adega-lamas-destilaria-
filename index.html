<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adega Lamas Destilaria</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-[#FDFBF7] text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [barris, setBarris] = useState(() => {
          const salvos = localStorage.getItem('barris_lamas');
          return salvos ? JSON.parse(salvos) : [
            { id: 'B-001', tipo: 'Carvalho Americano', liquido: 'Whisky', lote: 'L-2023-A', capacidade: 200, dataEntrada: '2023-01-15', status: 'Em Maturação', observacao: 'Primeiro uso' },
            { id: 'B-002', tipo: 'Carvalho Francês', liquido: 'Cachaça', lote: 'L-2023-B', capacidade: 225, dataEntrada: '2023-03-20', status: 'Em Maturação', observacao: 'Envelhecimento especial' },
            { id: 'B-003', tipo: 'Amburana', liquido: 'Cachaça Premium', lote: 'L-2024-C', capacidade: 200, dataEntrada: '2024-02-10', status: 'Pronto para Envase', observacao: 'Edição Ouro' }
          ];
        });

        const [abaAtiva, setAbaAtiva] = useState('lista');
        const [busca, setBusca] = useState('');
        const [filtroMadeira, setFiltroMadeira] = useState('Todas');
        const [filtroLiquido, setFiltroLiquido] = useState('Todos');
        const [filtroStatus, setFiltroStatus] = useState('Todos');

        const [novoBarril, setNovoBarril] = useState({
          id: '', tipo: 'Carvalho Americano', liquido: 'Whisky', lote: '', capacidade: '', dataEntrada: '', status: 'Em Maturação', observacao: ''
        });

        useEffect(() => {
          localStorage.setItem('barris_lamas', JSON.stringify(barris));
        }, [barris]);

        const adicionarBarril = (e) => {
          e.preventDefault();
          if (!novoBarril.id) return alert('Informe o número/ID do barril.');
          if (barris.some(b => b.id.toLowerCase() === novoBarril.id.toLowerCase())) {
            return alert('Já existe um barril com esta identificação.');
          }
          setBarris([...barris, novoBarril]);
          setNovoBarril({ id: '', tipo: 'Carvalho Americano', liquido: 'Whisky', lote: '', capacidade: '', dataEntrada: '', status: 'Em Maturação', observacao: '' });
          setAbaAtiva('lista');
        };

        const removerBarril = (id) => {
          if (confirm(`Deseja excluir o barril ${id}?`)) {
            setBarris(barris.filter(b => b.id !== id));
          }
        };

        // Filtros combinados por busca, madeira, líquido e status
        const barrisFiltrados = barris.filter(b => {
          const atendeBusca = b.id.toLowerCase().includes(busca.toLowerCase()) ||
                              (b.lote && b.lote.toLowerCase().includes(busca.toLowerCase())) ||
                              (b.observacao && b.observacao.toLowerCase().includes(busca.toLowerCase()));
          const atendeMadeira = filtroMadeira === 'Todas' || b.tipo === filtroMadeira;
          const atendeLiquido = filtroLiquido === 'Todos' || b.liquido === filtroLiquido;
          const atendeStatus = filtroStatus === 'Todos' || b.status === filtroStatus;

          return atendeBusca && atendeMadeira && atendeLiquido && atendeStatus;
        });

        const totalCapacidade = barris.reduce((acc, b) => acc + (Number(b.capacidade) || 0), 0);
        const totalEmMaturacao = barris.filter(b => b.status === 'Em Maturação').length;
        const totalProntos = barris.filter(b => b.status === 'Pronto para Envase').length;

        return (
          <div className="min-h-screen pb-12">
            {/* Cabeçalho Oficial Ajustado */}
            <header className="bg-[#2D1810] text-[#E6C280] p-4 shadow-xl text-center sticky top-0 z-20">
              <h1 className="text-xl font-black tracking-wide uppercase">
                🛢️ ADEGA LAMAS DESTILARIA
              </h1>
              <p className="text-xs text-[#C5A059] mt-1 font-semibold">
                Coordenador de Maturação: Marcos Pinheiro
              </p>
            </header>

            {/* Navegação por Abas */}
            <nav className="flex justify-center bg-[#3D2317] text-white text-xs font-bold sticky top-[68px] z-10 shadow-md">
              <button 
                onClick={() => setAbaAtiva('lista')}
                className={`flex-1 py-3 text-center border-b-2 transition-all ${abaAtiva === 'lista' ? 'border-[#C5A059] text-[#E6C280] bg-[#4A2D1F]' : 'border-transparent text-gray-300'}`}
              >
                📋 Barris ({barris.length})
              </button>
              <button 
                onClick={() => setAbaAtiva('dashboard')}
                className={`flex-1 py-3 text-center border-b-2 transition-all ${abaAtiva === 'dashboard' ? 'border-[#C5A059] text-[#E6C280] bg-[#4A2D1F]' : 'border-transparent text-gray-300'}`}
              >
                📊 Resumo
              </button>
              <button 
                onClick={() => setAbaAtiva('novo')}
                className={`flex-1 py-3 text-center border-b-2 transition-all ${abaAtiva === 'novo' ? 'border-[#C5A059] text-[#E6C280] bg-[#4A2D1F]' : 'border-transparent text-gray-300'}`}
              >
                ➕ Novo Barril
              </button>
            </nav>

            {/* Conteúdo Principal */}
            <main className="max-w-md mx-auto p-4 space-y-4">

              {abaAtiva === 'lista' && (
                <div className="space-y-3">
                  {/* Busca e Painel de Filtros Avançados */}
                  <div className="bg-white p-3 rounded-xl border border-[#E6C280]/40 shadow-sm space-y-2">
                    <input 
                      type="text"
                      placeholder="🔍 Buscar por ID, lote ou notas..."
                      value={busca}
                      onChange={(e) => setBusca(e.target.value)}
                      className="w-full p-2.5 rounded-lg border text-sm bg-gray-50 focus:bg-white focus:outline-none"
                    />

                    {/* Filtro por Madeira */}
                    <div className="flex items-center gap-2 text-xs">
                      <span className="font-bold text-gray-700 min-w-[60px]">Madeira:</span>
                      <select 
                        value={filtroMadeira} 
                        onChange={(e) => setFiltroMadeira(e.target.value)}
                        className="w-full p-1.5 border rounded bg-gray-50"
                      >
                        <option>Todas</option>
                        <option>Carvalho Americano</option>
                        <option>Carvalho Francês</option>
                        <option>Amburana</option>
                        <option>Bálsamo</option>
                        <option>Jequitibá Rosa</option>
                        <option>Cana-fístula</option>
                      </select>
                    </div>

                    {/* Filtro por Líquido */}
                    <div className="flex items-center gap-2 text-xs">
                      <span className="font-bold text-gray-700 min-w-[60px]">Líquido:</span>
                      <select 
                        value={filtroLiquido} 
                        onChange={(e) => setFiltroLiquido(e.target.value)}
                        className="w-full p-1.5 border rounded bg-gray-50"
                      >
                        <option>Todos</option>
                        <option>Whisky</option>
                        <option>Cachaça</option>
                        <option>Cachaça Premium</option>
                        <option>Gin</option>
                        <option>Rum</option>
                      </select>
                    </div>

                    {/* Botões de Filtro por Status */}
                    <div className="flex gap-1 text-[11px] pt-1 border-t">
                      {['Todos', 'Em Maturação', 'Pronto para Envase'].map(st => (
                        <button
                          key={st}
                          onClick={() => setFiltroStatus(st)}
                          className={`flex-1 py-1 rounded font-medium ${filtroStatus === st ? 'bg-[#2D1810] text-[#E6C280]' : 'bg-gray-100 text-gray-600'}`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Lista de Barris */}
                  {barrisFiltrados.length === 0 ? (
                    <div className="text-center py-8 text-gray-500 bg-white rounded-xl border p-4 text-xs">
                      Nenhum barril encontrado para os filtros selecionados.
                    </div>
                  ) : (
                    barrisFiltrados.map((b) => (
                      <div key={b.id} className="bg-white p-4 rounded-xl border border-[#E6C280]/40 shadow-md space-y-2">
                        <div className="flex justify-between items-start border-b pb-2">
                          <div>
                            <span className="text-xs font-black bg-[#2D1810] text-[#E6C280] px-2.5 py-0.5 rounded">
                              {b.id}
                            </span>
                            <h3 className="font-bold text-gray-800 text-base mt-1">{b.tipo}</h3>
                            <p className="text-xs font-semibold text-amber-800">🍷 {b.liquido || 'Não especificado'}</p>
                          </div>
                          <div className="text-right">
                            <span className="text-xs font-bold text-amber-900 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200 block">
                              {b.capacidade} Litros
                            </span>
                            <span className={`text-[10px] font-semibold mt-1 inline-block px-2 py-0.5 rounded ${b.status === 'Pronto para Envase' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}`}>
                              {b.status}
                            </span>
                          </div>
                        </div>

                        <div className="text-xs text-gray-600 space-y-1">
                          <p><strong>Lote:</strong> {b.lote || 'N/A'}</p>
                          <p><strong>Data de Entrada:</strong> {b.dataEntrada}</p>
                          {b.observacao && <p className="italic text-gray-500 bg-gray-50 p-2 rounded">"{b.observacao}"</p>}
                        </div>

                        <div className="pt-2 border-t flex justify-end">
                          <button 
                            onClick={() => removerBarril(b.id)}
                            className="text-xs text-red-600 font-bold hover:underline"
                          >
                            Excluir Registro
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* Resumo */}
              {abaAtiva === 'dashboard' && (
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-white p-4 rounded-xl border border-amber-200 text-center">
                      <p className="text-xs text-gray-500 font-bold uppercase">Total em Estoque</p>
                      <p className="text-2xl font-black text-[#2D1810] mt-1">{barris.length}</p>
                      <p className="text-[10px] text-gray-400">barris registrados</p>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-amber-200 text-center">
                      <p className="text-xs text-gray-500 font-bold uppercase">Capacidade Somada</p>
                      <p className="text-2xl font-black text-[#2D1810] mt-1">{totalCapacidade} L</p>
                      <p className="text-[10px] text-gray-400">volume total</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-amber-200 space-y-2 text-xs">
                    <h3 className="font-bold text-gray-800 text-sm border-b pb-2">Situação Atual da Adega</h3>
                    <div className="flex justify-between">
                      <span>🔵 Em Maturação:</span>
                      <span className="font-bold">{totalEmMaturacao} barris</span>
                    </div>
                    <div className="flex justify-between">
                      <span>🟢 Pronto para Envase:</span>
                      <span className="font-bold">{totalProntos} barris</span>
                    </div>
                  </div>
                </div>
              )}

              {/* Formulário com Madeira e Líquido */}
              {abaAtiva === 'novo' && (
                <form onSubmit={adicionarBarril} className="bg-white p-5 rounded-xl border border-[#E6C280]/40 shadow-lg space-y-3">
                  <h2 className="font-black text-gray-800 text-base border-b pb-2 text-[#2D1810]">
                    Cadastrar Novo Barril
                  </h2>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Identificação / Nº Barril *</label>
                    <input 
                      type="text" 
                      placeholder="Ex: B-004"
                      value={novoBarril.id}
                      onChange={(e) => setNovoBarril({...novoBarril, id: e.target.value})}
                      className="w-full p-2 border rounded text-sm bg-gray-50"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Madeira *</label>
                      <select 
                        value={novoBarril.tipo}
                        onChange={(e) => setNovoBarril({...novoBarril, tipo: e.target.value})}
                        className="w-full p-2 border rounded text-sm bg-gray-50"
                      >
                        <option>Carvalho Americano</option>
                        <option>Carvalho Francês</option>
                        <option>Amburana</option>
                        <option>Bálsamo</option>
                        <option>Jequitibá Rosa</option>
                        <option>Cana-fístula</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Líquido *</label>
                      <select 
                        value={novoBarril.liquido}
                        onChange={(e) => setNovoBarril({...novoBarril, liquido: e.target.value})}
                        className="w-full p-2 border rounded text-sm bg-gray-50"
                      >
                        <option>Whisky</option>
                        <option>Cachaça</option>
                        <option>Cachaça Premium</option>
                        <option>Gin</option>
                        <option>Rum</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Capacidade (L)</label>
                      <input 
                        type="number" 
                        placeholder="Ex: 200"
                        value={novoBarril.capacidade}
                        onChange={(e) => setNovoBarril({...novoBarril, capacidade: e.target.value})}
                        className="w-full p-2 border rounded text-sm bg-gray-50"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Status</label>
                      <select 
                        value={novoBarril.status}
                        onChange={(e) => setNovoBarril({...novoBarril, status: e.target.value})}
                        className="w-full p-2 border rounded text-sm bg-gray-50"
                      >
                        <option>Em Maturação</option>
                        <option>Pronto para Envase</option>
                        <option>Manutenção / Vazio</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Lote do Destilado</label>
                    <input 
                      type="text" 
                      placeholder="Ex: L-2024-01"
                      value={novoBarril.lote}
                      onChange={(e) => setNovoBarril({...novoBarril, lote: e.target.value})}
                      className="w-full p-2 border rounded text-sm bg-gray-50"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Data de Entrada</label>
                    <input 
                      type="date" 
                      value={novoBarril.dataEntrada}
                      onChange={(e) => setNovoBarril({...novoBarril, dataEntrada: e.target.value})}
                      className="w-full p-2 border rounded text-sm bg-gray-50"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Observações</label>
                    <textarea 
                      placeholder="Histórico, notas de prova..."
                      value={novoBarril.observacao}
                      onChange={(e) => setNovoBarril({...novoBarril, observacao: e.target.value})}
                      className="w-full p-2 border rounded text-sm bg-gray-50 h-16"
                    ></textarea>
                  </div>

                  <button type="submit" className="w-full py-3 bg-[#2D1810] text-[#E6C280] font-bold rounded shadow">
                    Salvar Registro de Barril
                  </button>
                </form>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
