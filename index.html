<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adega Lamas Destilaria</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-[#FDFBF7] text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Ícones SVG Nativo para não depender de pacotes externos
      const Icons = {
        Barrel: () => <svg className="w-6 h-6 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>,
        Plus: () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>,
        Chart: () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" /><path strokeLinecap="round" strokeLinejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" /></svg>,
        List: () => <svg className="w-4 h-4 inline-block mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
      };

      function App() {
        const [barris, setBarris] = useState(() => {
          const salvos = localStorage.getItem('barris_lamas');
          return salvos ? JSON.parse(salvos) : [
            { id: 'B-001', tipo: 'Carvalho Americano', lote: 'L-2023-A', capacidade: 200, dataEntrada: '2023-01-15', status: 'Em Maturação', observacao: 'Primeiro uso - Whisky' },
            { id: 'B-002', tipo: 'Carvalho Francês', lote: 'L-2023-B', capacidade: 225, dataEntrada: '2023-03-20', status: 'Em Maturação', observacao: 'Envelhecimento Cachaça' },
            { id: 'B-003', tipo: 'Amburana', lote: 'L-2024-C', capacidade: 200, dataEntrada: '2024-02-10', status: 'Pronto para Envase', observacao: 'Edição Especial' }
          ];
        });

        const [abaAtiva, setAbaAtiva] = useState('lista');
        const [filtro, setFiltro] = useState('');
        const [filtroStatus, setFiltroStatus] = useState('Todos');
        const [novoBarril, setNovoBarril] = useState({ id: '', tipo: 'Carvalho Americano', lote: '', capacidade: '', dataEntrada: '', status: 'Em Maturação', observacao: '' });

        useEffect(() => {
          localStorage.setItem('barris_lamas', JSON.stringify(barris));
        }, [barris]);

        const adicionarBarril = (e) => {
          e.preventDefault();
          if (!novoBarril.id) return alert('Por favor, informe a identificação do barril.');
          if (barris.some(b => b.id.toLowerCase() === novoBarril.id.toLowerCase())) {
            return alert('Já existe um barril cadastrado com essa identificação.');
          }
          setBarris([...barris, novoBarril]);
          setNovoBarril({ id: '', tipo: 'Carvalho Americano', lote: '', capacidade: '', dataEntrada: '', status: 'Em Maturação', observacao: '' });
          setAbaAtiva('lista');
        };

        const removerBarril = (id) => {
          if (confirm(`Tem certeza que deseja excluir o barril ${id}?`)) {
            setBarris(barris.filter(b => b.id !== id));
          }
        };

        const barrisFiltrados = barris.filter(b => {
          const atendeFiltroTexto = b.id.toLowerCase().includes(filtro.toLowerCase()) ||
            b.tipo.toLowerCase().includes(filtro.toLowerCase()) ||
            (b.lote && b.lote.toLowerCase().includes(filtro.toLowerCase()));
          const atendeFiltroStatus = filtroStatus === 'Todos' || b.status === filtroStatus;
          return atendeFiltroTexto && atendeFiltroStatus;
        });

        // Métricas Totais
        const totalCapacidade = barris.reduce((acc, b) => acc + (Number(b.capacidade) || 0), 0);
        const totalEmMaturacao = barris.filter(b => b.status === 'Em Maturação').length;
        const totalProntos = barris.filter(b => b.status === 'Pronto para Envase').length;

        return (
          <div className="min-h-screen pb-12">
            {/* Header Pro */}
            <header className="bg-[#2D1810] text-[#E6C280] p-4 shadow-xl text-center sticky top-0 z-20">
              <h1 className="text-xl font-extrabold flex items-center justify-center tracking-wide">
                <Icons.Barrel />
                ADEGA LAMAS DESTILARIA
              </h1>
              <p className="text-xs text-[#C5A059] mt-0.5 uppercase tracking-wider font-semibold">
                Controle de Maturação & Envelhecimento
              </p>
            </header>

            {/* Menu de Navegação */}
            <nav className="flex justify-center bg-[#3D2317] text-white text-xs font-bold sticky top-[60px] z-10 shadow-md">
              <button 
                onClick={() => setAbaAtiva('lista')}
                className={`flex-1 py-3 text-center border-b-2 transition-all ${abaAtiva === 'lista' ? 'border-[#C5A059] text-[#E6C280] bg-[#4A2D1F]' : 'border-transparent hover:bg-[#4A2D1F]/50 text-gray-300'}`}
              >
                <Icons.List /> Barris ({barris.length})
              </button>
              <button 
                onClick={() => setAbaAtiva('dashboard')}
                className={`flex-1 py-3 text-center border-b-2 transition-all ${abaAtiva === 'dashboard' ? 'border-[#C5A059] text-[#E6C280] bg-[#4A2D1F]' : 'border-transparent hover:bg-[#4A2D1F]/50 text-gray-300'}`}
              >
                <Icons.Chart /> Resumo
              </button>
              <button 
                onClick={() => setAbaAtiva('novo')}
                className={`flex-1 py-3 text-center border-b-2 transition-all ${abaAtiva === 'novo' ? 'border-[#C5A059] text-[#E6C280] bg-[#4A2D1F]' : 'border-transparent hover:bg-[#4A2D1F]/50 text-gray-300'}`}
              >
                <Icons.Plus /> Novo Barril
              </button>
            </nav>

            {/* Conteúdo Principal */}
            <main className="max-w-md mx-auto p-4 space-y-4">

              {/* ABA LISTA */}
              {abaAtiva === 'lista' && (
                <div className="space-y-4">
                  {/* Filtros */}
                  <div className="bg-white p-3 rounded-xl border border-[#E6C280]/40 shadow-sm space-y-2">
                    <input 
                      type="text"
                      placeholder="🔍 Buscar por ID, madeira ou lote..."
                      value={filtro}
                      onChange={(e) => setFiltro(e.target.value)}
                      className="w-full p-2.5 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-[#2D1810]"
                    />
                    <div className="flex gap-1 text-xs">
                      {['Todos', 'Em Maturação', 'Pronto para Envase'].map(st => (
                        <button
                          key={st}
                          onClick={() => setFiltroStatus(st)}
                          className={`flex-1 py-1.5 rounded-md font-medium transition-colors ${filtroStatus === st ? 'bg-[#2D1810] text-[#E6C280]' : 'bg-gray-100 text-gray-600'}`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Lista de Cards */}
                  {barrisFiltrados.length === 0 ? (
                    <div className="text-center py-10 text-gray-500 bg-white rounded-xl border p-4">
                      Nenhum barril encontrado.
                    </div>
                  ) : (
                    barrisFiltrados.map((b) => (
                      <div key={b.id} className="bg-white p-4 rounded-xl border border-[#E6C280]/40 shadow-md relative overflow-hidden">
                        <div className="flex justify-between items-start border-b border-gray-100 pb-2 mb-2">
                          <div>
                            <span className="text-xs font-extrabold bg-[#2D1810] text-[#E6C280] px-2.5 py-1 rounded shadow-sm">
                              {b.id}
                            </span>
                            <h3 className="font-bold text-gray-800 text-base mt-2">{b.tipo}</h3>
                          </div>
                          <div className="text-right">
                            <span className="text-xs font-bold text-amber-900 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200 block">
                              {b.capacidade} Litros
                            </span>
                            <span className={`text-[10px] font-semibold mt-1 inline-block px-2 py-0.5 rounded ${b.status === 'Pronto para Envase' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}`}>
                              {b.status}
                            </span>
                          </div>
                        </div>

                        <div className="text-xs text-gray-600 space-y-1 mt-2">
                          <p><strong>Lote do Destilado:</strong> {b.lote || 'Não informado'}</p>
                          <p><strong>Data de Entrada:</strong> {b.dataEntrada}</p>
                          {b.observacao && (
                            <p className="italic text-gray-600 mt-2 bg-[#FDFBF7] p-2 rounded border border-amber-100/60">
                              "{b.observacao}"
                            </p>
                          )}
                        </div>

                        <div className="mt-3 pt-2 border-t border-gray-100 flex justify-end">
                          <button 
                            onClick={() => removerBarril(b.id)}
                            className="text-xs text-red-600 font-bold hover:text-red-800 transition-colors"
                          >
                            Excluir Registro
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* ABA DASHBOARD / RESUMO */}
              {abaAtiva === 'dashboard' && (
                <div className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div className="bg-white p-4 rounded-xl border border-amber-200 shadow-sm text-center">
                      <p className="text-xs text-gray-500 font-bold uppercase">Total em Estoque</p>
                      <p className="text-2xl font-black text-[#2D1810] mt-1">{barris.length}</p>
                      <p className="text-[10px] text-gray-400">barris cadastrados</p>
                    </div>
                    <div className="bg-white p-4 rounded-xl border border-amber-200 shadow-sm text-center">
                      <p className="text-xs text-gray-500 font-bold uppercase">Volume Total</p>
                      <p className="text-2xl font-black text-[#2D1810] mt-1">{totalCapacidade} L</p>
                      <p className="text-[10px] text-gray-400">capacidade somada</p>
                    </div>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-amber-200 shadow-sm space-y-3">
                    <h3 className="font-bold text-gray-800 text-sm border-b pb-2">Status da Adega</h3>
                    <div className="flex justify-between items-center text-xs">
                      <span className="flex items-center"><span className="w-2.5 h-2.5 bg-blue-500 rounded-full mr-2"></span>Em Maturação</span>
                      <span className="font-bold">{totalEmMaturacao} barris</span>
                    </div>
                    <div className="flex justify-between items-center text-xs">
                      <span className="flex items-center"><span className="w-2.5 h-2.5 bg-green-500 rounded-full mr-2"></span>Pronto para Envase</span>
                      <span className="font-bold">{totalProntos} barris</span>
                    </div>
                  </div>
                </div>
              )}

              {/* ABA NOVO BARRIL */}
              {abaAtiva === 'novo' && (
                <form onSubmit={adicionarBarril} className="bg-white p-5 rounded-xl border border-[#E6C280]/40 shadow-lg space-y-4">
                  <h2 className="font-extrabold text-gray-800 text-base border-b pb-2 text-[#2D1810]">
                    Cadastrar Novo Barril
                  </h2>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Identificação / Nº Barril *</label>
                    <input 
                      type="text" 
                      placeholder="Ex: B-004"
                      value={novoBarril.id}
                      onChange={(e) => setNovoBarril({...novoBarril, id: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:outline-none focus:border-[#2D1810]"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Tipo de Madeira *</label>
                    <select 
                      value={novoBarril.tipo}
                      onChange={(e) => setNovoBarril({...novoBarril, tipo: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white"
                    >
                      <option>Carvalho Americano</option>
                      <option>Carvalho Francês</option>
                      <option>Amburana</option>
                      <option>Bálsamo</option>
                      <option>Jequitibá Rosa</option>
                      <option>Cana-fístula</option>
                      <option>Ipê</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Capacidade (L)</label>
                      <input 
                        type="number" 
                        placeholder="Ex: 200"
                        value={novoBarril.capacidade}
                        onChange={(e) => setNovoBarril({...novoBarril, capacidade: e.target.value})}
                        className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Status</label>
                      <select 
                        value={novoBarril.status}
                        onChange={(e) => setNovoBarril({...novoBarril, status: e.target.value})}
                        className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white"
                      >
                        <option>Em Maturação</option>
                        <option>Pronto para Envase</option>
                        <option>Manutenção / Vazio</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Lote do Destilado</label>
                    <input 
                      type="text" 
                      placeholder="Ex: L-2024-WHISKY"
                      value={novoBarril.lote}
                      onChange={(e) => setNovoBarril({...novoBarril, lote: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Data de Entrada</label>
                    <input 
                      type="date" 
                      value={novoBarril.dataEntrada}
                      onChange={(e) => setNovoBarril({...novoBarril, dataEntrada: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Observações</label>
                    <textarea 
                      placeholder="Histórico do barril, tipo de bebida, etc..."
                      value={novoBarril.observacao}
                      onChange={(e) => setNovoBarril({...novoBarril, observacao: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white h-20"
                    ></textarea>
                  </div>

                  <button type="submit" className="w-full py-3 bg-[#2D1810] text-[#E6C280] font-bold rounded-lg shadow-md hover:bg-[#3D2317] active:scale-[0.98] transition-transform">
                    Salvar Registro de Barril
                  </button>
                </form>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
