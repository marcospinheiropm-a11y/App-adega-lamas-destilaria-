<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adega Lamas Destilaria</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#FDFBF7]">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Ícones Lucide SVG nativos
      const BarrelIcon = () => (
        <svg className="w-6 h-6 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      );

      function App() {
        const [barris, setBarris] = useState(() => {
          const salvos = localStorage.getItem('barris_lamas');
          return salvos ? JSON.parse(salvos) : [
            { id: 'B-001', tipo: 'Carvalho Americano', lote: 'L-2023-A', capacidade: 200, dataEntrada: '2023-01-15', observacao: 'Primeiro uso - Whisky' },
            { id: 'B-002', tipo: 'Carvalho Francês', lote: 'L-2023-B', capacidade: 225, dataEntrada: '2023-03-20', observacao: 'Envelhecimento Cachaça' }
          ];
        });

        const [abaAtiva, setAbaAtiva] = useState('lista');
        const [filtro, setFiltro] = useState('');
        const [novoBarril, setNovoBarril] = useState({ id: '', tipo: 'Carvalho Americano', lote: '', capacidade: '', dataEntrada: '', observacao: '' });

        useEffect(() => {
          localStorage.setItem('barris_lamas', JSON.stringify(barris));
        }, [barris]);

        const adicionarBarril = (e) => {
          e.preventDefault();
          if (!novoBarril.id) return alert('Por favor, informe o ID do barril.');
          setBarris([...barris, novoBarril]);
          setNovoBarril({ id: '', tipo: 'Carvalho Americano', lote: '', capacidade: '', dataEntrada: '', observacao: '' });
          setAbaAtiva('lista');
        };

        const removerBarril = (id) => {
          if (confirm(`Deseja remover o barril ${id}?`)) {
            setBarris(barris.filter(b => b.id !== id));
          }
        };

        const barrisFiltrados = barris.filter(b => 
          b.id.toLowerCase().includes(filtro.toLowerCase()) ||
          b.tipo.toLowerCase().includes(filtro.toLowerCase()) ||
          (b.lote && b.lote.toLowerCase().includes(filtro.toLowerCase()))
        );

        return (
          <div className="min-h-screen pb-12">
            {/* Cabeçalho */}
            <header className="bg-[#2D1810] text-[#E6C280] p-4 shadow-lg text-center sticky top-0 z-10">
              <h1 className="text-xl font-bold flex items-center justify-center">
                <BarrelIcon />
                Adega Lamas Destilaria
              </h1>
              <p className="text-xs text-[#C5A059] mt-0.5">Gestão de Maturação e Envelhecimento</p>
            </header>

            {/* Menu de Abas */}
            <div className="flex justify-center bg-[#3D2317] text-white text-sm">
              <button 
                onClick={() => setAbaAtiva('lista')}
                className={`flex-1 py-3 text-center font-medium transition-colors ${abaAtiva === 'lista' ? 'bg-[#C5A059] text-black font-bold' : 'hover:bg-[#4A2D1F]'}`}
              >
                Barris ({barris.length})
              </button>
              <button 
                onClick={() => setAbaAtiva('novo')}
                className={`flex-1 py-3 text-center font-medium transition-colors ${abaAtiva === 'novo' ? 'bg-[#C5A059] text-black font-bold' : 'hover:bg-[#4A2D1F]'}`}
              >
                + Cadastrar
              </button>
            </div>

            {/* Conteúdo */}
            <main className="max-w-md mx-auto p-4">
              {abaAtiva === 'lista' ? (
                <div className="space-y-4">
                  {/* Busca */}
                  <input 
                    type="text"
                    placeholder="🔍 Buscar por ID, madeira ou lote..."
                    value={filtro}
                    onChange={(e) => setFiltro(e.target.value)}
                    className="w-full p-2.5 rounded-lg border border-gray-300 text-sm shadow-sm bg-white"
                  />

                  {/* Lista de Barris */}
                  {barrisFiltrados.length === 0 ? (
                    <div className="text-center py-8 text-gray-500 text-sm">Nenhum barril encontrado.</div>
                  ) : (
                    barrisFiltrados.map((b) => (
                      <div key={b.id} className="bg-white p-4 rounded-xl border border-[#E6C280]/40 shadow-sm relative">
                        <div className="flex justify-between items-start border-b border-gray-100 pb-2 mb-2">
                          <div>
                            <span className="text-xs font-bold bg-[#2D1810] text-[#E6C280] px-2 py-0.5 rounded">
                              {b.id}
                            </span>
                            <h3 className="font-bold text-gray-800 text-base mt-1">{b.tipo}</h3>
                          </div>
                          <div className="text-right">
                            <span className="text-xs font-medium text-amber-800 bg-amber-50 px-2 py-1 rounded-full border border-amber-200">
                              {b.capacidade} L
                            </span>
                          </div>
                        </div>

                        <div className="text-xs text-gray-600 space-y-1">
                          <p><strong>Lote:</strong> {b.lote || 'N/A'}</p>
                          <p><strong>Data de Entrada:</strong> {b.dataEntrada}</p>
                          {b.observacao && <p className="italic text-gray-500 mt-2 bg-gray-50 p-2 rounded">{b.observacao}</p>}
                        </div>

                        <button 
                          onClick={() => removerBarril(b.id)}
                          className="mt-3 text-xs text-red-600 font-medium hover:underline block text-right w-full"
                        >
                          Excluir barril
                        </button>
                      </div>
                    ))
                  )}
                </div>
              ) : (
                /* Formulário */
                <form onSubmit={adicionarBarril} className="bg-white p-5 rounded-xl border border-[#E6C280]/40 shadow-sm space-y-4">
                  <h2 className="font-bold text-gray-800 text-lg border-b pb-2">Novo Barril</h2>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">ID / Número do Barril</label>
                    <input 
                      type="text" 
                      placeholder="Ex: B-003"
                      value={novoBarril.id}
                      onChange={(e) => setNovoBarril({...novoBarril, id: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Madeira</label>
                    <select 
                      value={novoBarril.tipo}
                      onChange={(e) => setNovoBarril({...novoBarril, tipo: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50"
                    >
                      <option>Carvalho Americano</option>
                      <option>Carvalho Francês</option>
                      <option>Bálsamo</option>
                      <option>Jequitibá Rosa</option>
                      <option>Amburana</option>
                      <option>Cana-fístula</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Lote</label>
                    <input 
                      type="text" 
                      placeholder="Ex: L-2024-01"
                      value={novoBarril.lote}
                      onChange={(e) => setNovoBarril({...novoBarril, lote: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Capacidade (Liters)</label>
                    <input 
                      type="number" 
                      placeholder="Ex: 200"
                      value={novoBarril.capacidade}
                      onChange={(e) => setNovoBarril({...novoBarril, capacidade: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Data de Entrada</label>
                    <input 
                      type="date" 
                      value={novoBarril.dataEntrada}
                      onChange={(e) => setNovoBarril({...novoBarril, dataEntrada: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Observações</label>
                    <textarea 
                      placeholder="Notas adicionais..."
                      value={novoBarril.observacao}
                      onChange={(e) => setNovoBarril({...novoBarril, observacao: e.target.value})}
                      className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 h-20"
                    ></textarea>
                  </div>
                  <button type="submit" className="w-full py-3 bg-[#2D1810] text-[#E6C280] font-bold rounded-lg shadow">
                    Salvar Barril
                  </button>
                </form>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
